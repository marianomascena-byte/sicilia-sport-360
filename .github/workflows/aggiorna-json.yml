name: SS360 - Aggiorna notizie JSON

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */3 * * *'

permissions:
  contents: write

concurrency:
  group: ss360-news-json
  cancel-in-progress: false

jobs:
  aggiorna-json:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Leggi feed e aggiorna solo notizie.json
        run: |
          python - <<'PY'
          import datetime as dt
          import email.utils
          import hashlib
          import json
          import pathlib
          import re
          import urllib.parse
          import urllib.request
          import urllib.robotparser
          import xml.etree.ElementTree as ET

          FEEDS = [
              ('Sporticily', 'https://www.sporticily.it/feed/', 'sporticily.it'),
              ('LiveSicilia Sport', 'https://livesicilia.it/articoli/sport/feed/', 'livesicilia.it'),
          ]
          UA = 'SiciliaSport360/1.0 (RSS link discovery)'
          sports = [
              ('Pallacanestro', 'basket|pallacanestro|orlandina'),
              ('Pallavolo', 'volley|pallavolo'),
              ('Calcio a 5', 'futsal|calcio a 5'),
              ('Pallanuoto', 'pallanuoto'),
              ('Nuoto', 'nuoto|nuotatori'),
              ('Tennis', 'tennis|padel'),
              ('Rugby', 'rugby'),
              ('Motori', 'rally|motociclismo|formula 1'),
              ('Atletica', 'atletica|maratona'),
              ('Calcio', 'calcio|palermo|catania|siracusa|messina|trapani|derby|rossazzurr|rosaner|serie b|serie c|serie d'),
          ]
          provinces = 'Agrigento Caltanissetta Catania Enna Messina Palermo Ragusa Siracusa Trapani'.split()
          now = dt.datetime.now(dt.timezone.utc)
          cutoff = now - dt.timedelta(days=15)
          path = pathlib.Path('notizie.json')
          try:
              previous = json.loads(path.read_text(encoding='utf-8'))
          except (OSError, ValueError):
              previous = {}
          records = {a['url']: a for a in previous.get('articles', []) if isinstance(a, dict) and a.get('url', '').startswith('https://')}
          sources_ok = 0

          for source, feed, domain in FEEDS:
              try:
                  host = urllib.parse.urlsplit(feed).netloc
                  rp = urllib.robotparser.RobotFileParser()
                  rp.set_url('https://' + host + '/robots.txt')
                  rp.read()
                  if not rp.can_fetch(UA, feed):
                      print(source, 'non verificabile: robots.txt', flush=True)
                      continue
                  request = urllib.request.Request(feed, headers={'User-Agent': UA, 'Accept': 'application/rss+xml, application/xml, text/xml'})
                  with urllib.request.urlopen(request, timeout=15) as response:
                      xml = response.read(500000)
                  items = ET.fromstring(xml).findall('./channel/item')
                  if not items:
                      print(source, 'nessun elemento RSS', flush=True)
                      continue
                  sources_ok += 1
                  added = 0
                  for item in items[:40]:
                      title = ' '.join((item.findtext('title') or '').split())
                      url = (item.findtext('link') or '').strip()
                      parsed = urllib.parse.urlsplit(url)
                      if not title or parsed.scheme != 'https' or not (parsed.hostname == domain or parsed.hostname == 'www.' + domain):
                          continue
                      try:
                          when = email.utils.parsedate_to_datetime(item.findtext('pubDate', ''))
                          when = when.replace(tzinfo=dt.timezone.utc) if when.tzinfo is None else when.astimezone(dt.timezone.utc)
                      except (ValueError, TypeError):
                          continue
                      if not cutoff <= when <= now + dt.timedelta(hours=2):
                          continue
                      low = title.casefold()
                      sport = next((kind for kind, words in sports if any(w in low for w in words.split('|'))), 'Altri sport')
                      province = next((p for p in provinces if p.casefold() in low), 'Sicilia')
                      if source == 'LiveSicilia Sport' and sport == 'Altri sport':
                          continue
                      if url not in records:
                          records[url] = {
                              'id': hashlib.sha256(url.encode()).hexdigest()[:14],
                              'label': f'{sport} · {province} — notizia su {source}',
                              'url': url,
                              'source': source,
                              'published_at': when.isoformat(),
                              'sport': sport,
                              'province': province,
                          }
                          added += 1
                  print(source, ':', len(items), 'elementi RSS,', added, 'nuovi link', flush=True)
              except (OSError, ValueError, ET.ParseError) as exc:
                  print(source, 'non disponibile:', type(exc).__name__, str(exc)[:120], flush=True)

          if sources_ok == 0:
              raise SystemExit('Nessun feed disponibile: archivio lasciato invariato')
          recent = [a for a in records.values() if a.get('published_at', '') >= cutoff.isoformat()]
          recent.sort(key=lambda a: a['published_at'], reverse=True)
          recent = recent[:90]
          if recent == previous.get('articles', []):
              print('Nessuna nuova notizia: nessun file modificato')
          else:
              output = {'generated_at': now.isoformat(), 'sources_ok': sources_ok, 'articles': recent}
              path.write_text(json.dumps(output, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
              print('Archivio aggiornato:', len(recent), 'collegamenti,', sources_ok, 'fonti raggiunte')
          PY
      - name: Salva solo notizie.json
        run: |
          if [ -f notizie.json ]; then
            git add notizie.json
            if ! git diff --cached --quiet; then
              git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Aggiorna archivio notizie sport siciliano'
              git push
            else
              echo 'Archivio invariato: nessun commit'
            fi
          else
            echo 'Nessun archivio generato'
          fi
