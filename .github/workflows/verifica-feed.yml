name: Verifica feed Sicilia Sport 360
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verifica-rss:
    runs-on: ubuntu-latest
    steps:
      - name: Analizza notizie e duplicati
        run: |
          python - <<'PY'
          import urllib.request
          import urllib.parse
          import xml.etree.ElementTree as ET
          import re
          feeds = ['sport','palermo','catania','agrigento','caltanissetta','enna','messina','ragusa','siracusa','trapani']
          sport = re.compile(r'calcio|futsal|volley|pallavolo|basket|pallacanestro|nuoto|tennis|padel|rugby|atletic|pallanuoto|ciclism|scherma|rally|motocicl|campionat|derby|rossazzurr|rosaner',re.I)
          visti = set()
          unici = 0
          pertinenti = 0
          for nome in feeds:
              url = 'https://livesicilia.it/articoli/' + nome + '/feed/'
              try:
                  richiesta = urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
                  with urllib.request.urlopen(richiesta,timeout=12) as risposta:
                      dati = risposta.read(400000)
                  articoli = ET.fromstring(dati).findall('.//item')
                  print('\nFEED:',nome,'ARTICOLI:',len(articoli))
                  for a in articoli:
                      titolo = (a.findtext('title') or '').strip()
                      link = (a.findtext('link') or '').strip()
                      parsed = urllib.parse.urlsplit(link)
                      chiave = urllib.parse.urlunsplit((parsed.scheme,parsed.netloc,parsed.path,'',''))
                      if not chiave: continue
                      duplicato = chiave in visti
                      visti.add(chiave)
                      if not duplicato: unici += 1
                      candidato = bool(sport.search(titolo))
                      if candidato and not duplicato: pertinenti += 1
                      print('TITOLO:',titolo)
                      print('LINK:',link)
                      print('DUPLICATO:',duplicato,'SPORT CANDIDATO:',candidato)
              except Exception as e:
                  print(nome,'ERRORE:',str(e))
          print('\nTOTALE NOTIZIE UNICHE:',unici)
          print('CANDIDATE SPORTIVE UNICHE:',pertinenti)
          PY
